services:
  safegate:
    build: .
    container_name: safegate
    ports:
      - "8443:8443"
    environment:
      - SAFEGATE_PORT=8443
      - SAFEGATE_API_KEY=${SAFEGATE_API_KEY:-}
      - SAFEGATE_CLAMAV_ADDR=clamav:3310
      - SAFEGATE_CLAMAV_ENABLED=true
      - SAFEGATE_MAX_FILE_SIZE=52428800
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - safegate-net

  clamav:
    image: clamav/clamav:1.3
    container_name: safegate-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    networks:
      - safegate-net

volumes:
  clamav-data:

networks:
  safegate-net:
    driver: bridge
