services:
  safegate:
    build: .
    container_name: safegate
    ports:
      - "8443:8443"
    environment:
      - SAFEGATE_PORT=8443
      - SAFEGATE_API_KEY=${SAFEGATE_API_KEY:-}
      - SAFEGATE_CLAMAV_ADDR=clamav:3310
      - SAFEGATE_CLAMAV_ENABLED=true
      - SAFEGATE_MAX_FILE_SIZE=52428800
      - SAFEGATE_ETCD_ENABLED=true
      - SAFEGATE_ETCD_ENDPOINTS=etcd:2379
      - SAFEGATE_CACHE_TTL=3600
    depends_on:
      clamav:
        condition: service_started
      etcd:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - safegate-net

  clamav:
    image: clamav/clamav:stable
    container_name: safegate-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/3310' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    networks:
      - safegate-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: safegate-etcd
    environment:
      - ETCD_NAME=safegate-etcd
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=safegate-etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=safegate-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - safegate-net

volumes:
  clamav-data:
  etcd-data:

networks:
  safegate-net:
    driver: bridge
